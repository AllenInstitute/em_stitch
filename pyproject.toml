[project]
name = "em-stitch"
requires-python = ">3.6,<3.14"
description = "Distortion correction and montage stitching for EM images"
readme = "README.md"
dynamic = ["version"]
license = {file = "LICENSE"}
authors = [
  {name = "Daniel Kapner"},
  {name = "Russel Torres"},
  {name = "Jay Borseth"}
]
maintainers = [
  {name = "Russel Torres"}
]
dependencies = [
    "marshmallow<3.0",
    "argschema<2.0",
    "render-python>=2.2.0",
    "numpy>=1.13",
    "scipy>=1.2.1",
    "triangle",
    "bigfeta>=1.0.3",
    "opencv-python",
    "setuptools ; python_version >= '3.12'",
    "uri_handler",
]

[project.optional-dependencies]
test = [
    "mccabe<0.7.0,>=0.6.0",
    "coverage>=4.1",
    "mock>=2.0.0",
    "pep8>=1.7.0",
    "pytest>=3.0.5",
    "pytest-cov>=2.2.1",
    "pytest-pep8>=1.0.6",
    "pytest-xdist>=1.14",
    "flake8>=3.0.4",
    "pylint>=1.5.4",
    "jinja2",
    "shapely",
    "scikit-image",
]
pypi-build = [
  "build",
  "twine"
]

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "em_stitch"
]

[tool.setuptools_scm]
version_file = "em_stitch/_version.py"

# some downgrades from pixi's expectations
[tool.pixi.system-requirements]
linux = "5.0.0"
libc = "2.27"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
em_stitch = { path = ".", editable = true }

# conda-enabled features
[tool.pixi.feature.pixi-base.dependencies]
numpy = "*"
pandas = "*"
scipy = "*"
petsc4py = "*"

# version-specific python features
[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.jupyter.dependencies]
jupyter = "*"
python-dotenv = "*"

[tool.pixi.environments]
py310-test = ["py310", "test"]
py311-test = ["py311", "test"]
py312-test = ["py312", "test"]
py313-test = ["py313", "test"]
conda-env = ["pixi-base"]
py310-conda-test = ["py310", "pixi-base", "test"]
py311-conda-test = ["py311", "pixi-base", "test"]
py312-conda-test = ["py312", "pixi-base", "test"]
py313-conda-test = ["py313", "pixi-base", "test"]
build = ["pypi-build"]
conda-jupyter = ["pixi-base", "jupyter"]

[tool.coverage.run]
omit = ["integration_tests/*"]

[tool.pixi.feature.test.tasks]
test = "pytest  --cov --cov-report=xml --junitxml=test-reports/test.xml"

[tool.pixi.feature.jupyter.tasks]
notebook = "jupyter notebook"

[tool.pixi.feature.pypi-build.tasks]
pypi-build = "python -m build"
pypi-test-upload = "python -m twine upload --repository testpypi dist/*"
pypi-test-deploy = "python -m build && python -m twine upload --repository testpypi dist/*"
